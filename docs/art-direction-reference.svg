  <rect x="962" y="481" width="166" height="62" rx="14" fill="#FFF6E5" stroke="#24665E" stroke-width="2"/>
  <text x="990" y="519" font-size="18" font-weight="650">Read / Stop</text>
  <text x="44" y="619" font-size="18" font-weight="650">Shallow depth · warm materials · live text · generous controls</text>
  <text x="44" y="650" font-size="16" fill="#52645F">Control states — shapes and labels carry meaning alongside colour</text>
  <rect x="44" y="670" width="245" height="62" rx="14" fill="#FFF6E5" stroke="#24665E" stroke-width="2"/>
  <text x="69" y="708" font-size="18" font-weight="650">Normal: Place plank</text>
  <rect x="310" y="670" width="245" height="62" rx="14" fill="#F4B85A" stroke="#24665E" stroke-width="2"/>
  <text x="335" y="708" font-size="18" font-weight="650">Selected: 3 m plank</text>
  <rect x="571" y="664" width="257" height="74" rx="20" fill="#FFF6E5" stroke="#24665E" stroke-width="3"/>
  <rect x="577" y="670" width="245" height="62" rx="14" fill="#24665E"/>
  <text x="602" y="708" font-size="18" font-weight="650" fill="#FFF6E5">Focus: Check</text>
  <rect x="849" y="670" width="307" height="62" rx="14" fill="#F8E6DC" stroke="#263D38" stroke-width="2"/>
  <text x="874" y="708" font-size="18" font-weight="650">Try another arrangement</text>
  <text x="44" y="773" font-size="16" fill="#52645F">Static direction sample · original code-native SVG · not a runtime asset or playable screen</text>
 </g>
</svg>
