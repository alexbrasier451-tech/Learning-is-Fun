 <g font-family="Segoe UI, system-ui, sans-serif" fill="#263D38">
  <rect x="750" y="154" width="406" height="432" rx="26" fill="#FFF6E5" filter="url(#ref-shadow)"/>
  <text x="778" y="191" font-size="16" fill="#52645F" font-weight="650">Q1 · A BRIDGE BACK HOME</text>
  <text x="778" y="231" font-size="24" font-weight="700">Help Rowan join the banks</text>
  <text x="778" y="268" font-size="18">Choose a plank, then choose a space.</text>
  <text x="778" y="295" font-size="18">You can move it before you Check.</text>
  <rect x="778" y="320" width="176" height="64" rx="14" fill="#F4B85A" stroke="#24665E" stroke-width="2"/>
  <path d="M793 354l5 5l9-12" fill="none" stroke="#263D38" stroke-width="3"/>
  <text x="818" y="347" font-size="18" font-weight="650">3 m plank</text><text x="818" y="370" font-size="16">Selected</text>
  <rect x="968" y="320" width="160" height="64" rx="14" fill="#FFF6E5" stroke="#24665E" stroke-width="2"/>
  <text x="989" y="359" font-size="18" font-weight="650">Remove plank</text>
  <rect x="778" y="401" width="350" height="62" rx="14" fill="#E1EEE2"/>
  <path d="M795 430l6 6l11-15" fill="none" stroke="#244D42" stroke-width="3"/>
  <text x="824" y="438" font-size="18" fill="#244D42" font-weight="650">Bridge restored</text>
  <rect x="778" y="481" width="168" height="62" rx="14" fill="#24665E"/>
