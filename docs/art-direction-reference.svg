<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="ref-title ref-desc">
 <title id="ref-title">The Lost Kingdom — layered storybook direction</title>
 <desc id="ref-desc">Original static design reference: miniature timber village and river bridge with a leaf-tailed fox, a cream live-text activity area and labelled control states. Not a playable game.</desc>
 <defs>
  <linearGradient id="ref-sky" x2="0" y2="1"><stop stop-color="#DCEDE0"/><stop offset="1" stop-color="#FFF6E5"/></linearGradient>
  <linearGradient id="ref-water" x2="0" y2="1"><stop stop-color="#599D91"/><stop offset="1" stop-color="#24665E"/></linearGradient>
  <filter id="ref-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#263D38" flood-opacity=".16"/></filter>
  <g id="ref-tree"><path d="M0 0v-68" stroke="#776E4D" stroke-width="9"/><path d="M-38-63Q-51-100-17-116Q6-148 34-111Q62-87 30-58Z" fill="#244D42"/><path d="M-22-88Q-30-110-9-119Q14-133 26-110Q36-93 16-80Z" fill="#46705A"/></g>
  <g id="ref-flower"><path d="M0 0v-25" stroke="#244D42" stroke-width="3"/><path d="M0-7q-16-16-17-2q8 6 17 2" fill="#46705A"/><circle cy="-29" r="10" fill="#C16C60"/><circle cy="-29" r="4" fill="#F4B85A"/></g>
 </defs>
 <rect width="1200" height="800" fill="#F0E6D2"/>
 <g font-family="Segoe UI, system-ui, sans-serif" fill="#263D38">
  <text x="44" y="38" font-size="16" font-weight="650" letter-spacing="2">LEARNING IS FUN</text>
  <text x="44" y="85" font-size="36" font-weight="750">The Lost Kingdom</text>
  <text x="45" y="118" font-size="18">A small world. Something wonderful to mend.</text>
  <rect x="920" y="48" width="236" height="52" rx="14" fill="#FFF6E5" stroke="#24665E" stroke-width="2"/>
  <path d="M940 74h14m-7-7v14" stroke="#263D38" stroke-width="2"/>
  <text x="970" y="81" font-size="18" font-weight="650">Silence all</text>
  <text x="931" y="123" font-size="16" fill="#52645F">Sound controls always in reach</text>
 </g>
 <!-- Three shallow art planes; no assessed text is baked into this scene. -->
