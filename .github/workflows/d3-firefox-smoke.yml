name: D3 Firefox fixture smoke

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Run the accepted component smoke or only the M1 adventure cases
        type: choice
        required: true
        default: components
        options:
          - components
          - adventure

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_DISABLE_COMPILE_CACHE: '1'
      ADULT_REAL_RELEASE: 'yes'
      D3_SELECTION: ${{ inputs.selection }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
          run_install: false
          cache: false
      - name: Prepare private evidence
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { platform, release } from 'node:os';
          if (!process.env.RUNNER_TEMP || !process.env.GITHUB_ENV) {
            throw new Error('Runner temporary directory and environment file are required.');
          }
          const selections = { components: { adult: 3, hall: 3, audio: 2, creative: 2 }, adventure: { adventure: 6 } };
          const selection = process.env.D3_SELECTION;
          if (!selection || !Object.hasOwn(selections, selection)) throw new Error('D3_SELECTION must be components or adventure.');
          const expected = selections[selection];
          appendFileSync(process.env.GITHUB_ENV, `D3_FIXTURES=${Object.keys(expected).join(' ')}\n`);
          const root = join(process.env.RUNNER_TEMP, 'd3-firefox');
          const roots = {
            D3_EVIDENCE_ROOT: root,
            ADULT_VERIFY_ROOT: join(root, 'adult'),
            HALL_VERIFY_ROOT: join(root, 'hall'),
            AUDIO_VERIFY_ROOT: join(root, 'audio'),
            CREATIVE_VERIFY_ROOT: join(root, 'creative'),
            ADVENTURE_VERIFY_ROOT: join(root, 'adventure'),
          };
          for (const [key, value] of Object.entries(roots)) {
            mkdirSync(value, { recursive: true });
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          writeFileSync(join(root, 'run.json'), JSON.stringify({
            commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT, os: platform(), release: release(),
            node: process.version, viewport: { width: 1280, height: 720 },
            selection, expected,
          }, null, 2));
          NODE
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck supported projects
        run: pnpm typecheck
      - name: Verify bounded discovery
        run: |
          for fixture in $D3_FIXTURES; do
            D3_FIXTURE="$fixture" pnpm exec playwright test --config tests/fixtures/d3-firefox.config.ts --project D3-Firefox --list --reporter=json > "$D3_EVIDENCE_ROOT/$fixture/discovery.json"
          done
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const selections = { components: { adult: 3, hall: 3, audio: 2, creative: 2 }, adventure: { adventure: 6 } };
          if (!Object.hasOwn(selections, process.env.D3_SELECTION ?? '')) throw new Error('Unknown D3 selection.');
          const expected = selections[process.env.D3_SELECTION];
          const tests = suites => suites.flatMap(suite => [
            ...(suite.specs ?? []).flatMap(spec => spec.tests ?? []),
            ...tests(suite.suites ?? []),
          ]);
          for (const [fixture, count] of Object.entries(expected)) {
            const report = JSON.parse(readFileSync(join(process.env.D3_EVIDENCE_ROOT, fixture, 'discovery.json'), 'utf8'));
            const found = tests(report.suites ?? []);
            if (report.errors?.length || found.length !== count || found.some(test => test.projectName !== 'D3-Firefox')) {
              throw new Error(`${fixture}: expected ${count} D3 tests; discovered ${found.length}.`);
            }
            console.log(`${fixture}: ${count} D3 tests discovered`);
          }
          NODE
      - name: Install matched Firefox and Linux dependencies
        run: |
          pnpm exec playwright --version | tee "$D3_EVIDENCE_ROOT/playwright-version.txt"
          pnpm exec playwright install --with-deps firefox
      - name: Install native virtual-output packages
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils
      - name: Start and verify private native audio output
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, chmodSync, mkdirSync, mkdtempSync, statSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { join } from 'node:path';
          import { userInfo } from 'node:os';
          const uid = userInfo().uid;
          if (uid === 0) throw new Error('Native audio must run as the runner user, not root.');
          const evidence = join(process.env.D3_EVIDENCE_ROOT, 'audio-output');
          mkdirSync(evidence, { recursive: true });
          const runtime = mkdtempSync(join(process.env.RUNNER_TEMP, 'd3-pulse-'));
          chmodSync(runtime, 0o700);
          const socket = join(runtime, 'native');
          const cookie = join(runtime, 'cookie');
          if (Buffer.byteLength(socket) >= 108) throw new Error('Private Unix socket path exceeds Linux limit.');
          const sinkName = 'd3_output';
          const startup = [
            'load-module module-null-sink sink_name=d3_output rate=44100 channels=2 channel_map=front-left,front-right sink_properties=device.description=D3_CI_Virtual_Output',
            `load-module module-native-protocol-unix socket=${JSON.stringify(socket)} auth-cookie=${JSON.stringify(cookie)} auth-anonymous=0`,
            'set-default-sink d3_output',
          ].join('\n') + '\n';
          const script = join(evidence, 'default.pa');
          const client = join(evidence, 'client.conf');
          writeFileSync(script, startup);
          writeFileSync(client, 'autospawn = no\n');
          const routing = { PULSE_SERVER: `unix:${socket}`, PULSE_SINK: sinkName, PULSE_COOKIE: cookie,
            PULSE_CLIENTCONFIG: client, PULSE_RUNTIME_PATH: runtime };
          const env = { ...process.env, ...routing, LC_ALL: 'C' };
          const report = { observedAt: new Date().toISOString(), phase: 'before-original-browser-cases',
            commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, uid, routing,
            startupScript: startup, ready: false, commands: [] };
          // Retain the exact private route even if startup fails, for targeted cleanup.
          for (const [key, value] of Object.entries(routing)) appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          appendFileSync(process.env.GITHUB_ENV, `D3_PULSE_RUNTIME=${runtime}\n`);
          function command(name, args, timeout = 3000) {
            const r = spawnSync(name, args, { env, encoding: 'utf8', timeout, maxBuffer: 32768, killSignal: 'SIGKILL' });
            report.commands.push({ name, args, exitCode: r.status, signal: r.signal, error: r.error?.code ?? null,
              stdout: (r.stdout ?? '').slice(0, 32768), stderr: (r.stderr ?? '').slice(0, 32768) });
            if (r.error || r.status !== 0) throw new Error(`${name} failed; see native output readiness evidence.`);
            return r.stdout;
          }
          try {
            report.packages = command('dpkg-query', ['-W', '-f=${Package}\t${Version}\t${db:Status-Status}\n',
              'pulseaudio', 'pulseaudio-utils', 'libpulse0']);
            report.version = command('pulseaudio', ['--version']).trim();
            command('pulseaudio', ['--daemonize=yes', '--system=no', '--use-pid-file=yes', '--exit-idle-time=-1',
              '--realtime=no', '--high-priority=no', '--fail=yes', '--log-level=notice',
              `--log-target=file:${join(runtime, 'daemon.log')}`, '-n', `--file=${script}`], 10000);
            const socketStat = statSync(socket);
            report.socket = { path: socket, uid: socketStat.uid, mode: (socketStat.mode & 0o777).toString(8), isSocket: socketStat.isSocket() };
            if (!report.socket.isSocket || report.socket.uid !== uid) throw new Error('Private native socket ownership/type mismatch.');
            report.server = JSON.parse(command('pactl', ['--server', routing.PULSE_SERVER, '--format=json', 'info']));
            report.sinks = JSON.parse(command('pactl', ['--server', routing.PULSE_SERVER, '--format=json', 'list', 'sinks']));
            report.modules = JSON.parse(command('pactl', ['--server', routing.PULSE_SERVER, '--format=json', 'list', 'modules']));
            // PulseAudio 16.1 module JSON omits IDs; the supported short text list includes them.
            report.moduleIdentities = command('pactl', ['--server', routing.PULSE_SERVER, '--format=text', 'list', 'short', 'modules'])
              .trimEnd().split('\n').filter(Boolean).map(row => {
                const [id, name, argument = ''] = row.split('\t');
                if (!/^\d+$/.test(id) || !name || !Number.isSafeInteger(Number(id))) {
                  throw new Error('Malformed native module identity row.');
                }
                return { index: Number(id), name, argument };
              });
            if (new Set(report.moduleIdentities.map(item => item.index)).size !== report.moduleIdentities.length) {
              throw new Error('Ambiguous native module identities.');
            }
            const sink = report.sinks.find(item => item.name === sinkName);
            const module = report.moduleIdentities.find(item => item.index === sink?.owner_module);
            if (report.server.default_sink_name !== sinkName || report.server.server_string !== routing.PULSE_SERVER ||
                !sink || module?.name !== 'module-null-sink' || sink.driver !== 'module-null-sink.c' ||
                !/\b2ch 44100Hz$/.test(sink.sample_specification) || sink.channel_map !== 'front-left,front-right' ||
                !['IDLE', 'RUNNING'].includes(sink.state) || sink.mute !== false) {
              throw new Error('Expected private, unmuted, clocked stereo native output is not ready.');
            }
            report.ready = true;
            console.log('Private PulseAudio stereo output verified; original browser cases may now run.');
          } catch (error) { report.failure = error.message; throw error; }
          finally { writeFileSync(join(evidence, 'readiness.json'), JSON.stringify(report, null, 2)); }
          NODE
      - name: Run D3 views and routes serially
        shell: bash
        env:
          DEBUG: 'pw:browser'
          LC_ALL: C
        run: |
          for fixture in $D3_FIXTURES; do
            D3_FIXTURE="$fixture" pnpm exec playwright test --config tests/fixtures/d3-firefox.config.ts --project D3-Firefox 2>&1 |
              awk 'NR <= 256 { print substr($0, 1, 1024) } NR == 257 { print "[browser log truncated: first 256 lines, 1024 bytes per line]" }' |
              tee "$D3_EVIDENCE_ROOT/$fixture/browser.log"
          done
      - name: Observe runner audio host without activating services
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import { accessSync, constants, openSync, readSync, closeSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { join } from 'node:path';
          import { userInfo } from 'node:os';
          const limit = 32_768;
          const names = ['ps', 'systemctl', 'dpkg-query', 'aplay', 'pulseaudio', 'pactl', 'pw-cli', 'wpctl'];
          const commands = Object.fromEntries(names.map(name => {
            let inaccessible = false;
            for (const dir of (process.env.PATH ?? '').split(':')) {
              if (!dir) continue;
              const path = join(dir, name);
              try { if (!statSync(path).isFile()) continue; accessSync(path, constants.X_OK); return [name, { status: 'available', path }]; }
              catch (error) { if (error.code !== 'ENOENT' && error.code !== 'ENOTDIR') inaccessible = true; }
            }
            return [name, { status: inaccessible ? 'unavailable' : 'missing' }];
          }));
          function probe(name, args) {
            if (commands[name].status !== 'available') return { status: `command-${commands[name].status}`, args };
            const result = spawnSync(commands[name].path, args, { encoding: 'utf8', timeout: 3000,
              maxBuffer: limit, killSignal: 'SIGKILL', env: { ...process.env, LC_ALL: 'C', SYSTEMD_COLORS: '0' } });
            const status = result.error?.code === 'ETIMEDOUT' ? 'timeout' : result.error?.code === 'ENOBUFS' ? 'output-limit' :
              result.error ? 'spawn-failed' : result.status === 0 ? 'observed' : 'probe-failed';
            return { status, args, exitCode: result.status, signal: result.signal, error: result.error?.code ?? null,
              stdout: (result.stdout ?? '').slice(0, limit), stderr: (result.stderr ?? '').slice(0, limit) };
          }
          function textFile(path) {
            let fd;
            try {
              fd = openSync(path, 'r'); const buffer = Buffer.alloc(limit + 1);
              const bytes = readSync(fd, buffer, 0, buffer.length, 0);
              return { status: 'observed', path, truncated: bytes > limit, text: buffer.subarray(0, Math.min(bytes, limit)).toString('utf8') };
            } catch (error) { return { status: error.code === 'ENOENT' ? 'missing' : 'unavailable', path, error: error.code }; }
            finally { if (fd !== undefined) closeSync(fd); }
          }
          function pathInfo(path) {
            try {
              const s = statSync(path);
              const permitted = mode => { try { accessSync(path, mode); return true; } catch { return false; } };
              return { status: 'observed', path, socket: s.isSocket(), characterDevice: s.isCharacterDevice(),
                uid: s.uid, gid: s.gid, mode: (s.mode & 0o777).toString(8), readable: permitted(constants.R_OK), writable: permitted(constants.W_OK) };
            } catch (error) { return { status: error.code === 'ENOENT' ? 'missing' : 'unavailable', path, error: error.code }; }
          }
          function processes() {
            const result = probe('ps', ['-eo', 'pid=,ppid=,uid=,stat=,comm=']);
            const rows = (result.stdout ?? '').split('\n').filter(row => /\b(pulseaudio|pipewire|pipewire-pulse|wireplumber|jackd|jackdbus)\s*$/.test(row));
            return { ...result, stdout: rows.join('\n'), matchingCount: result.status === 'observed' ? rows.length : null };
          }
          let devices;
          try { const entries = readdirSync('/dev/snd'); devices = { status: 'observed', truncated: entries.length > 64,
            entries: entries.sort().slice(0, 64).map(name => pathInfo(join('/dev/snd', name))) }; }
          catch (error) { devices = { status: error.code === 'ENOENT' ? 'missing' : 'unavailable', error: error.code }; }
          const units = ['pulseaudio.service', 'pulseaudio.socket', 'pipewire.service', 'pipewire.socket',
            'pipewire-pulse.service', 'pipewire-pulse.socket', 'wireplumber.service'];
          const properties = '--property=Id,LoadState,ActiveState,SubState,MainPID,Result,Listen';
          const unixSockets = textFile('/proc/net/unix');
          if (unixSockets.text) unixSockets.text = unixSockets.text.split('\n').filter(line => /pulse\/native|pipewire-\d+/.test(line)).join('\n');
          const report = {
            observedAt: new Date().toISOString(), phase: 'after-original-tests-or-earlier-job-failure',
            commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, uid: userInfo().uid,
            limits: { commandTimeoutMs: 3000, outputBytesPerStream: limit, textFileBytes: limit, deviceEntries: 64 },
            environment: Object.fromEntries(['XDG_RUNTIME_DIR', 'PULSE_SERVER', 'PULSE_SINK', 'PIPEWIRE_REMOTE',
              'DBUS_SESSION_BUS_ADDRESS', 'ALSA_CONFIG_PATH', 'SDL_AUDIODRIVER'].map(key => [key, process.env[key] ?? null])),
            commands, processesBefore: processes(), devices,
            alsaCards: textFile('/proc/asound/cards'), alsaPcm: textFile('/proc/asound/pcm'), unixSockets,
            socketFiles: process.env.XDG_RUNTIME_DIR ? ['pulse/native', 'pipewire-0'].map(path => pathInfo(join(process.env.XDG_RUNTIME_DIR, path))) :
              { status: 'unavailable', reason: 'XDG_RUNTIME_DIR unset; no runtime path guessed' },
            userUnits: probe('systemctl', ['--user', '--no-pager', 'show', ...units, properties]),
            systemUnits: probe('systemctl', ['--no-pager', 'show', ...units, properties]),
            packages: probe('dpkg-query', ['-W', '-f=${Package}\t${Version}\t${db:Status-Status}\n',
              'pulseaudio', 'pulseaudio-utils', 'libpulse0', 'pipewire', 'pipewire-pulse', 'wireplumber', 'alsa-utils', 'libasound2t64']),
            alsaHardwareOutputs: probe('aplay', ['-l']),
            serverSinks: { status: 'not-probed', reason: 'No PulseAudio/PipeWire client connection: avoid autospawn and socket activation' },
          };
          report.processesAfter = processes();
          writeFileSync(join(process.env.D3_EVIDENCE_ROOT, 'audio-host.json'), JSON.stringify(report, null, 2));
          console.log('Passive audio-host evidence retained; missing or failed probes do not imply no server/device.');
          NODE
      - name: Require selected actual passes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const selections = { components: { adult: 3, hall: 3, audio: 2, creative: 2 }, adventure: { adventure: 6 } };
          if (!Object.hasOwn(selections, process.env.D3_SELECTION ?? '')) throw new Error('Unknown D3 selection.');
          const expected = selections[process.env.D3_SELECTION];
          const tests = suites => suites.flatMap(suite => [
            ...(suite.specs ?? []).flatMap(spec => spec.tests ?? []),
            ...tests(suite.suites ?? []),
          ]);
          for (const [fixture, count] of Object.entries(expected)) {
            const report = JSON.parse(readFileSync(join(process.env.D3_EVIDENCE_ROOT, fixture, 'results.json'), 'utf8'));
            const found = tests(report.suites ?? []);
            if (report.errors?.length || found.length !== count || report.stats?.expected !== count ||
                report.stats.unexpected !== 0 || report.stats.flaky !== 0 || report.stats.skipped !== 0 ||
                found.some(test => test.projectName !== 'D3-Firefox' || test.expectedStatus !== 'passed' ||
                  test.results.length !== 1 || test.results[0].status !== 'passed')) {
              throw new Error(`${fixture}: requires ${count} actual passes, no skipped, failed or flaky results.`);
            }
            console.log(`${fixture}: ${count} actual D3 passes`);
          }
          NODE
      - name: Stop private native audio output and retain its log
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          import { openSync, readSync, closeSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { join } from 'node:path';
          if (process.env.D3_PULSE_RUNTIME) {
            const runtime = process.env.D3_PULSE_RUNTIME;
            const server = `unix:${join(runtime, 'native')}`;
            const evidence = join(process.env.D3_EVIDENCE_ROOT, 'audio-output');
            const r = spawnSync('pactl', ['--server', server, 'exit'], {
              env: { ...process.env, PULSE_SERVER: server, PULSE_RUNTIME_PATH: runtime },
              encoding: 'utf8', timeout: 3000, maxBuffer: 32768, killSignal: 'SIGKILL' });
            const cleanup = { observedAt: new Date().toISOString(), server,
              exitCode: r.status, signal: r.signal, error: r.error?.code ?? null,
              stdout: (r.stdout ?? '').slice(0, 32768), stderr: (r.stderr ?? '').slice(0, 32768) };
            let fd;
            try {
              fd = openSync(join(runtime, 'daemon.log'), 'r');
              const buffer = Buffer.alloc(32769); const bytes = readSync(fd, buffer, 0, buffer.length, 0);
              cleanup.logTruncated = bytes > 32768;
              writeFileSync(join(evidence, 'daemon.log'), buffer.subarray(0, Math.min(bytes, 32768)));
            } catch (error) { cleanup.logError = error.code; }
            finally { if (fd !== undefined) closeSync(fd); }
            writeFileSync(join(evidence, 'cleanup.json'), JSON.stringify(cleanup, null, 2));
            if (r.error || r.status !== 0) process.exitCode = 1;
          }
          NODE
      - name: Retain compact evidence including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: d3-firefox-${{ inputs.selection }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/d3-firefox/run.json
            ${{ runner.temp }}/d3-firefox/playwright-version.txt
            ${{ runner.temp }}/d3-firefox/audio-host.json
            ${{ runner.temp }}/d3-firefox/audio-output/readiness.json
            ${{ runner.temp }}/d3-firefox/audio-output/default.pa
            ${{ runner.temp }}/d3-firefox/audio-output/client.conf
            ${{ runner.temp }}/d3-firefox/audio-output/daemon.log
            ${{ runner.temp }}/d3-firefox/audio-output/cleanup.json
            ${{ runner.temp }}/d3-firefox/*/browser.log
            ${{ runner.temp }}/d3-firefox/*/discovery.json
            ${{ runner.temp }}/d3-firefox/*/results.json
            ${{ runner.temp }}/d3-firefox/*/playwright/
          retention-days: 1
          if-no-files-found: warn
